name: Publish to PyPI

# Trusted publishing, so there is no API token to store or leak. The PyPI side
# needs a publisher configured for this repository and this workflow filename.
# Once that exists, a release publishes without any credential in this repo.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Required for the OIDC token that PyPI exchanges for an upload token.
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # A release that ships a broken build is worse than a release that never
      # happens, so the suite gates the upload.
      - name: Run the test suite
        run: uv run --python 3.12 --extra dev pytest

      - name: Build
        run: uv build

      # Prints PyPI's own verdict before uv hides it behind a generic 403.
      - name: Check the OIDC exchange
        run: |
          resp=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=pypi")
          token=$(echo "$resp" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
          echo "  claims:"
          echo "$resp" | python3 -c '
          import sys, json, base64
          segment = json.load(sys.stdin)["value"].split(".")[1]
          segment += "=" * (-len(segment) % 4)
          claims = json.loads(base64.urlsafe_b64decode(segment))
          for key in ("repository", "repository_owner", "job_workflow_ref"):
              print(f"    {key}: {claims.get(key)}")
          '
          echo "  verdict:"
          curl -sS -X POST https://pypi.org/_/oidc/mint-token \
            -H "Content-Type: application/json" \
            -d "{\"token\": \"${token}\"}" \
            | python3 -c '
          import sys, json
          body = json.load(sys.stdin)
          if "token" in body:
              print("    SUCCESS")
          else:
              for error in body.get("errors", []):
                  print("   ", error.get("code"), "-", error.get("description"))
          '

      - name: Publish
        run: uv publish
        # No UV_PUBLISH_TOKEN here, not even an empty one. uv treats the variable
        # as present whenever it is declared at all, and an empty value makes it
        # skip the OIDC exchange and send an empty bearer token, which PyPI
        # answers with a 403. Leaving it undeclared is what triggers trusted
        # publishing.
