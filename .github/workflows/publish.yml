name: Publish to PyPI

# Trusted publishing, so there is no API token to store or leak. The PyPI side
# needs a publisher configured for this repository and this workflow filename.
# Once that exists, a release publishes without any credential in this repo.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Required for the OIDC token that PyPI exchanges for an upload token.
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # A release that ships a broken build is worse than a release that never
      # happens, so the suite gates the upload.
      - name: Run the test suite
        run: uv run --python 3.12 --extra dev pytest

      - name: Build
        run: uv build

      - name: Publish
        run: uv publish
        # No UV_PUBLISH_TOKEN here, not even an empty one. uv treats the variable
        # as present whenever it is declared at all, and an empty value makes it
        # skip the OIDC exchange and send an empty bearer token, which PyPI
        # answers with a 403. Leaving it undeclared is what triggers trusted
        # publishing.
