name: OIDC diagnostic

# Temporary. Performs the OIDC exchange by hand and prints PyPI's own error,
# which uv collapses into a generic 403. Delete once publishing works.
on:
  workflow_dispatch:

jobs:
  claims:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Show the claims PyPI matches on
        run: |
          resp=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=pypi")
          echo "$resp" | python3 -c '
          import sys, json, base64
          token = json.load(sys.stdin)["value"]
          segment = token.split(".")[1]
          segment += "=" * (-len(segment) % 4)
          claims = json.loads(base64.urlsafe_b64decode(segment))
          for key in ("aud", "sub", "repository", "repository_owner",
                      "repository_owner_id", "job_workflow_ref", "workflow_ref",
                      "event_name"):
              print(f"  {key}: {claims.get(key)}")
          '

      - name: Exchange the token and print PyPI's verdict
        run: |
          resp=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=pypi")
          token=$(echo "$resp" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
          echo "  mint-token response:"
          curl -sS -X POST https://pypi.org/_/oidc/mint-token \
            -H "Content-Type: application/json" \
            -d "{\"token\": \"${token}\"}" \
            | tee /tmp/mint.json | python3 -c '
          import sys, json
          raw = sys.stdin.read()
          try:
              body = json.loads(raw)
          except Exception:
              print("   raw:", raw[:500])
              raise SystemExit
          if "token" in body:
              print("   SUCCESS: PyPI minted a short-lived token")
          else:
              print("   raw:", json.dumps(body)[:500])
          '
